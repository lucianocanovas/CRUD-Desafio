# ==========================================
# CONFIGURACIÓN GENERAL DEL SERVIDOR
# ==========================================
server.port=8080
spring.application.name=usuario-service

# ==========================================
# BASE DE DATOS SQLITE (Persistencia en archivo usuariodb.db)
# ==========================================
spring.datasource.url=jdbc:sqlite:usuariodb.db
spring.datasource.driver-class-name=org.sqlite.JDBC
spring.jpa.database-platform=org.hibernate.community.dialect.SQLiteDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# ==========================================
# SEGURIDAD JWT
# ==========================================
app.jwt.secret=ConcursoABMChocolateBlockGiganteSecretKey2026SuperSecureMustBeAtLeast256Bits
app.jwt.expiration-milliseconds=86400000

# ==========================================
# SWAGGER / OPENAPI
# ==========================================
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.operations-sorter=method
springdoc.swagger-ui.tags-sorter=alpha
