# ==========================================
# PERFIL DE PRODUCCIÓN / DEPLOY (DON WEB / MYSQL)
# ==========================================
# Activar con: java -jar -Dspring.profiles.active=prod app.jar
# O variable de entorno: SPRING_PROFILES_ACTIVE=prod

spring.datasource.url=jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME:usuariodb}?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
spring.datasource.username=${DB_USER:root}
spring.datasource.password=${DB_PASSWORD:root}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false

app.jwt.secret=${JWT_SECRET:ConcursoABMChocolateBlockGiganteSecretKey2026SuperSecureMustBeAtLeast256Bits}
app.jwt.expiration-milliseconds=${JWT_EXPIRATION:86400000}
